# Colección: Mapas desordenados y listas ordenadas

# Listas ordenadas: Colección de nodos en la que el orden importa
- item1
-  true
- 33
-
    - subitem1
    - subitem2
-
                -    subitem1
                - subitem2
    # Sangrado que he de aplicar aqui: EL QUE QUIERA , PERO SIN VACILAR
    # Y cuidado.. si uso NANO, VI... un tab se puede representar como 4 espacios... pero SON COSAS DIFERENTES.
    # Y esto da mucho dolor de cabeza si no uso un editor bueno, como VSCODE, que cambia los tabs por espacios
    # Si en un item tengo un tab y en otro 4 espacios en blanco.. aunque LOS VEA IGUAL, YAML piensa que le estoy VACILANDO -> ERROR DE SINTAXIS
---
# Hay una sintaxis alternativa a las listas:
- item1
- 2
- true
---
[item1, 2, true] # Esto cuela. # DESACONSEJADO TOTALMENTE. 2 motivos:
    # - Es más complejo de leer
    # - Estos archivos van a terminar (DEBERIAN TERMINAR) en un sistema de control de versiones, tipo GIT
    #   Git identifica cambios a nivel de linea. Si en una linea pongo 3 items, y cambio uno, GIT NO ES CAPAZ DE DECIRME QUE HE CAMBIADO.. solo la linea donde esta el cambio.
    #   Si pongo cada item en una linea, GIT me dirá exactamente qué item he cambiado.
# Esta sintaxis existe para COMPATIBILIDAD CON JSON: TODO DOCUMENTO JSON SE PUEDE TRATAR COMO SI FUERA YAML:
# YAML SE HA COMIDO AL ESTANDAR JSON... O de otyra forma: JSON ES UN SUBCONJUNTO DE YAML. TODO JSON ES YAML, PERO NO TODO YAML ES JSON.
# Solo hay un caso de uso legítimo de esta sintaxis: LISTA VACIA:
---
[] # Esto es una lista vacía. No hay otra forma de escribirlo.
---
# Mapas desarodenados: Son listas de items(nodos) que van identificadas por una clave. Lista de pares clave-valor. El orden no importa.
clave1:       valor1
clave2: true
clave3: 33
clave4: 
    - subitem1
    - subitem2
clave5:
    subclave1: subvalor1
    subclave2:          subvalor2

clave6:
                subclave1: subvalor1
                subclave2: subvalor2
    # Mismas reglas de sangrado que en las listas. Puedo usar el que quiera, pero sin vacilar.

---

# Hay una sintaxis alternativa a los mapas desordenados:
{clave1: valor1, clave2: true, clave3: 33}
# Esta sintaxis existe para COMPATIBILIDAD CON JSON: TODO DOCUMENTO JSON SE PUEDE TRATAR COMO SI FUERA YAML:
# No la usamos los humanos... mismos motivos que en las listas: Complejo de leer y GIT no es capaz de identificar cambios a nivel de item.
# Solo hay un caso de uso legítimo de esta sintaxis: MAPA VACIO:
---
{} # Esto es un mapa vacío. No hay otra forma de escribirlo.
---
# Nota adicional:
# LOS MAPAS SON DESORDENADOS!!! EL ORDEN NO IMPORTA
clave1: valor1
clave2: true
clave3: 33
---
clave1: valor1
clave3: 33
clave2: true
# Desde el punto de vista de YAML, son exactamente iguales. El orden no importa.

# Y esto es todo amigos!!!!!
---
# NOTA 2
# YAML define una sintaxis... mas simple que XML o JSON
# JSON:
#    { 
#           "usuario": "pepe",
#           "password": "1234",
#           "ssh": {
#                       "host": "192.168.1.2",
#                       "port": 22
#                   }
#    }

# XML: 
#    <usuario>
#       <nombre>pepe</nombre>
#       <password>1234</password>
#       <ssh>
#           <host>192.168.1.2</host>
#           <port>22</port>
#       </ssh>
#    </usuario>

# YAML:
usuario:
    nombre:             pepe
    password:           1234
    ssh:
        host:           192.168.1.2
        port:           22

# Pero decía:
# YAML SOLO DA LA SINTAXIS.
# Cada programa que usa YAML define su ESQUEMA
# Es decir, la estructura que tiene que tener ese archivo YAML

# Si yo le paso el documento del usuario a NETPLAN en UBUNTU: FLIPA! 
# Si yo le paso el documento del usuario a CLOUD-INI: FLIPA!

---

# Un documento netplan tiene esta pinta:
network:
    version: 2
    renderer: networkd
    ethernets:
        eth0:
            dhcp4: true
            nameservers:
                addresses: 
                    - 8.8.8.8
                    - 8.8.4.4
---
# Un documento cloud-init tiene esta pinta:
#cloud-config
users:
    - name: pepe
      groups: sudo
      shell: /bin/bash

package_update: true
packages:
    - htop
    - git

# Si paso otras marcas: ERROR DE SINTAXIS. No es que no entienda el YAML.. es que no entiende el esquema de cloud-init.
