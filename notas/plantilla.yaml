# YAML Es un lenguaje de marcado de información
# Sería una alternativa a XML o a JSON, o incluso a ficheros .properties .ini
# No es una alternativa... es LA ATERNATIVA.
# Todo hoy en día se hace con archivos YAML:
# - Terraform: Toda la parametrización de infraestructura como código se hace con YAML.
# - Kubernetes: Todos los despliegues de contenedores se hacen con YAML.
# - Ansible: La configuración de sistemas y despliegues automatizados se hace con YAML.
# - Ubuntu: La definición de la red de Ubuntu se hace con YAML.
# Todo el mundo está usando YAML.. y cada día más.
# Es muy sencillo. Está pensado para seres humanos.

# Podemos poner comentarios: ALELUYA ! Eso de que en json no se puedan poner comentarios es un horror. En YAML sí se pueden poner comentarios, y además, son muy útiles.
# Lo que pongo detrás del # es un comentario. No se ejecuta, no se interpreta, no se procesa. Es solo para que los humanos podamos entender mejor el código.

# Dentro de un archivo YAML puedo tener muchos documentos yaml.
# No se soporta en ningún otro lenguaje.
--- 
# Los --- son la marca de inicio de documento
# Permiten escribir en un fichero varios documentos distintos, que se procesarían de forma independiente.
# Es obligatoria, salvo en el primero documento del archivo que no se pone.
---
# A la vista del nombre.. a quién nos recuerda? YAML
#                                                XML
#                                               HTML
# ML? Markup language.. lenguaje de marcado... y por ende, qué esperamos encontrar dentro?   <tag> </tag>  <tag> </tag>  <tag> </tag>  <tag> </tag>
# Pero no... YAML = YAML ain't markup language. No busques aquñi marquitas que no las vas a encontrar
---
# Un documento YAML es UN NODO.
# Hay 2 tipos de nodos: Escalares y Colecciones.
---
# Escalares: Son los valores simples, como un número, un string, un booleano, etc.
# Números: 
4
